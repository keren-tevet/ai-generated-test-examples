<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Kafka Dashboard</h1>
      <p class="subtitle">Connected to Aiven Kafka</p>
    </header>

    <div id="service-info" class="card">
      <h2>Cluster Info</h2>
      <div class="service-grid" id="service-details">
        <div class="service-stat">
          <div class="label">Status</div>
          <div class="value" id="status">Loading...</div>
        </div>
      </div>
    </div>

    <div id="topics-section">
      <div class="section-header">
        <h2>Topics <span id="topic-count" class="badge"></span></h2>
        <button id="refresh-btn" class="btn">Refresh</button>
      </div>
      <div class="topics-grid" id="topics-list"></div>
    </div>

    <div id="messages-section" class="card hidden">
      <div class="messages-header">
        <h2>Messages from <span id="current-topic"></span></h2>
        <button id="close-messages" class="btn btn-small">Close</button>
      </div>
      <div class="messages-controls">
        <label>
          Partition:
          <input type="number" id="partition-input" value="0" min="0">
        </label>
        <label>
          Offset:
          <input type="number" id="offset-input" value="0" min="0">
        </label>
        <label>
          Limit:
          <input type="number" id="limit-input" value="10" min="1" max="100">
        </label>
        <button id="consume-btn" class="btn">Consume Messages</button>
      </div>
      <div id="messages-list" class="messages-list"></div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>

    <div id="error-toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
